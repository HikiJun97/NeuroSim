[project]
name = "neurosim"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "absl-py>=0.7.0",
    "gradio>=6.14.0",
    "numpy>=2.4.1",
    "prettytable>=3.17.0",
    "pyyaml>=6.0.3",
    "scipy>=1.17.0",
    "setuptools>=80.9.0",
    "sphinx-glpi-theme>=0.6",
    "torch>=2.9.1",
    "torchvision>=0.24.1",
    "tqdm>=4.67.1",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "ruff>=0.11.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "F403"]
"pytorch-quantization/**" = ["E711", "E712", "E721", "E741", "F401", "F403", "F405", "F841"]

[tool.ruff.lint.isort]
known-first-party = ["neurosim"]
